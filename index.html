<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snowboard Rush – Modular Arcade</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #1b3b4f 0%, #2d5f6e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .game-container {
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #a0d8ef;
        }
        canvas {
            display: block;
            background: #e8f4f8;
            width: 100%;
            height: auto;
            max-width: 800px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .instructions {
            color: white;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
<div style="display: flex; flex-direction: column; align-items: center;">
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>
    <div class="instructions">
        ⬆️ Space / Up Arrow or Tap to Jump | ← → spin while airborne | Collect ⚡ boosts
    </div>
</div>
<script src="js/audio.js"></script>
<script src="js/tricks.js"></script>
<script src="js/powerups.js"></script>
<script src="js/main.js"></script>
</body>
</html>
