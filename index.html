<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1b3b4f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Snowboard Rush - An arcade snowboarding endless runner">
    <title>Snowboard Rush</title>
    <link rel="manifest" href="manifest.json">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #1b3b4f;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none; user-select: none;
            touch-action: none;
            position: fixed;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .game-wrapper {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 800px;
            padding: 12px;
        }
        canvas {
            display: block;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.45);
            border: 2px solid #a0d8ef;
            width: 100%;
            height: auto;
            aspect-ratio: 800 / 400;
            image-rendering: auto;
        }
        .hint {
            color: rgba(255,255,255,0.7); text-align: center;
            font-size: 12px; margin-top: 8px; letter-spacing: 0.5px;
            padding: 0 4px;
        }
    </style>
</head>
<body>
<div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div class="hint">🏂 Space / Tap to Jump &nbsp;|&nbsp; ← → / Touch Sides to Spin &nbsp;|&nbsp; Collect ⚡ Boosts &nbsp;|&nbsp; G to Grab</div>
</div>

<script src="js/core/engine.js"></script>
<script src="js/core/physics.js"></script>
<script src="js/core/renderer.js"></script>
<script src="js/systems/audio.js"></script>
<script src="js/systems/terrain.js"></script>
<script src="js/systems/tricks.js"></script>
<script src="js/systems/powerups.js"></script>
<script src="js/systems/achievements.js"></script>
<script src="js/entities/player.js"></script>
<script src="js/entities/obstacles.js"></script>
<script src="js/entities/bosses.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/overlays.js"></script>
<script src="js/main.js"></script>
</body>
</html>
